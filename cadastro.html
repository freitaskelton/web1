<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Zaraki Kenpachi</title>
</head>

<body>

    <h1>Cadastro</h1>

    <p>
        Cadastre-se para fazer parte da página dedicada a Zaraki Kenpachi,
        personagem do universo de Bleach.
    </p>

    <h2>Dados pessoais</h2>

    <form>

        <label>Nome completo:</label>
        <input type="text">

        <br><br>

        <label>Idade:</label>
        <input type="number">

        <br><br>

        <label>E-mail:</label>
        <input type="email">

        <br><br>

        <label>Data de nascimento:</label>
        <input type="date">

        <br><br>

        <label>País:</label>
        <input type="text">

        <h2>Informações sobre Bleach</h2>

        <label>Você conhece Bleach?</label>

        <br>

        <input type="radio" name="bleach" value="sim">
        <label>Sim</label>

        <input type="radio" name="bleach" value="nao">
        <label>Não</label>

        <br><br>

        <label>Personagem favorito:</label>
        <input type="text">

        <br><br>

        <label>Você gosta de Zaraki Kenpachi?</label>

        <br>

        <input type="radio" name="zaraki" value="sim">
        <label>Sim</label>

        <input type="radio" name="zaraki" value="nao">
        <label>Não</label>

        <br><br>

        <label>O que mais gosta no personagem?</label>

        <br>

        <textarea rows="5" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Cadastrar">

        <input type="reset" value="Limpar">

    </form>

    <br>

    <a href="index.html">Voltar para o início</a>

</body>
</html>
